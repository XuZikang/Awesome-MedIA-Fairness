name: Literature discovery and catalog update
on:
  # Production: IAI-61 fairness-weekly.timer, Sunday 10:07 Asia/Shanghai.
  workflow_dispatch:
concurrency:
  group: fairness-catalog-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Discover papers and publish human review packets
        env:
          GH_TOKEN: ${{ github.token }}
          LITERATURE_LLM_ENDPOINT: ${{ vars.LITERATURE_LLM_ENDPOINT }}
          LITERATURE_LLM_MODEL: ${{ vars.LITERATURE_LLM_MODEL }}
          LITERATURE_LLM_CACHE_NAMESPACE: ${{ vars.LITERATURE_LLM_CACHE_NAMESPACE }}
          LITERATURE_LLM_API_KEY: ${{ secrets.LITERATURE_LLM_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
        run: bash scripts/run_weekly_literature.sh
      - name: Preserve unpublished diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fairness-unpublished-diagnostics
          path: .local/publication.*/reports/
          include-hidden-files: true
          if-no-files-found: ignore
