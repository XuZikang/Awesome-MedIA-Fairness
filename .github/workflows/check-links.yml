name: Check links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-links.yml
      - .lychee.toml
      - README.md
      - CONTRIBUTING.md
      - CITATION.cff
      - LICENSE-CONTENT
      - docs/**
      - scripts/evaluate_link_report.py
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml
            './**/*.md'
            CITATION.cff
            LICENSE-CONTENT
          fail: false
          failIfEmpty: false
          format: json
          output: lychee/out.json
          checkbox: false
          jobSummary: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate link report
        run: python3 scripts/evaluate_link_report.py lychee/out.json
